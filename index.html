<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi Casa</title>
<!-- Al añadirla a la pantalla de inicio del iPhone: icono propio y pantalla completa, sin barra de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg: #0d0d0f; --card: #1a1a1e; --text: #f2f2f2; --muted: #9a9a9e; --accent: #3b82f6; --border: #2a2a2e; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* Se deja libre la zona de la muesca y la de la barra de inicio, y la app va en medio */
  iframe {
    position: fixed; border: 0; background: var(--bg);
    left: 0; right: 0; width: 100%;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
  .msg {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    font: 15px -apple-system, system-ui, sans-serif; color: var(--muted); text-align: center;
  }
  .key { width: 100%; max-width: 320px; }
  .key input {
    width: 100%; box-sizing: border-box; margin: 14px 0 10px; padding: 12px 14px; font-size: 16px;
    background: var(--card); color: var(--text); border: 2px solid var(--border); border-radius: 12px;
  }
  .key button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 700; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff;
  }
</style>
</head>
<body>
<div class="msg" id="msg">Cargando…</div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbxPo8mq_KMkHlhgZu-du9DhWYZk6wRSWIm8Pf0rzB_fvAzlD8csaYcZZSNZZIK7H6SabA/exec';

  // La clave no está en esta página (es pública): llega una vez en el enlace (#k=…) o se pega a mano,
  // y se guarda en este iPhone.
  function storedKey() { try { return localStorage.getItem('casaKey') || ''; } catch (e) { return ''; } }
  function saveKey(k) { try { localStorage.setItem('casaKey', k); } catch (e) {} }

  var m = location.hash.match(/k=([\w-]+)/);
  if (m) saveKey(m[1]);
  var key = m ? m[1] : storedKey();
  var page = new URLSearchParams(location.search).get('page') || 'home';

  if (key) {
    var f = document.createElement('iframe');
    f.title = 'Mi Casa';
    f.src = EXEC + '?wrap=1&page=' + encodeURIComponent(page) + '&k=' + encodeURIComponent(key);
    document.body.appendChild(f);
  } else {
    var msg = document.getElementById('msg');
    msg.innerHTML = '<div class="key">Pega la clave de Mi Casa para abrirla en este dispositivo.' +
      '<input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Clave">' +
      '<button id="ok">Abrir</button></div>';
    document.getElementById('ok').onclick = function () {
      var v = document.getElementById('k').value.trim().replace(/^.*k=/, '');
      if (!/^[\w-]{10,}$/.test(v)) return;
      saveKey(v);
      location.reload();
    };
  }
</script>
</body>
</html>
